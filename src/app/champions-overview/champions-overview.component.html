<div class="overview">

  <header class="overview-header">
    <div>
      <h2 class="overview-title">Champions</h2>
      <p class="overview-count" *ngIf="champions.length">{{ champions.length }} in the pool</p>
    </div>
    <button type="button" class="close-button" (click)="closeDialog()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <div class="overview-body">
    <div class="overview-loading" *ngIf="!champions.length">
      <div class="loading__bar"></div>
      <p>Loading champions&hellip;</p>
    </div>

    <div class="card-grid-list" *ngIf="champions.length">
      <div class="champ-tile" *ngFor="let item of champions">
        <div class="champ-frame">
          <img [src]="item.png" [alt]="item.name" loading="lazy" decoding="async" />
        </div>
        <p class="champ-name">{{ item.name }}</p>
      </div>
    </div>
  </div>

</div>
